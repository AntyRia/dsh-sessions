[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsh-sessions"
version = "0.1.0"
description = "Session manager & disk reclaimer for DeepSeek Harness (DSH) — CLI + tkinter GUI, in sync with DSH's local storage"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AntyRia" }]
keywords = ["deepseek", "dsh", "deepseek-harness", "sessions", "disk-space", "cli", "gui", "tkinter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Tk",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "zstandard>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
dsh-sessions = "dsh_sessions.cli:main"
dsh-sessions-gui = "dsh_sessions.gui:main"

[project.urls]
Homepage = "https://github.com/AntyRia/dsh-sessions"
Issues = "https://github.com/AntyRia/dsh-sessions/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
